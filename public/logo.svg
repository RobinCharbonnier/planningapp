<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#1A1A1A"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C9A227" stroke-width="1.2"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A227" stroke-width="0.7"/>

  <!-- "LE 38 RIV" top arc text -->
  <defs>
    <path id="topArc" d="M 22,100 A 78,78 0 0,1 178,100"/>
    <path id="bottomArc" d="M 30,118 A 75,75 0 0,0 170,118"/>
  </defs>
  <text font-family="Georgia, serif" font-size="13.5" fill="#C9A227" font-weight="600" letter-spacing="5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">LE 38 RIV</textPath>
  </text>

  <!-- "JAZZ CLUB" bottom arc text -->
  <text font-family="Georgia, serif" font-size="13.5" fill="#C9A227" font-weight="600" letter-spacing="5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">JAZZ CLUB</textPath>
  </text>

  <!-- "38" in gold, stylized -->
  <text x="52" y="118" font-family="Georgia, serif" font-size="62" fill="#C9A227" font-weight="bold" font-style="italic">38</text>
  <!-- "R" in white, offset to overlap -->
  <text x="118" y="118" font-family="Georgia, serif" font-size="62" fill="#FFFFFF" font-weight="bold" font-style="italic">R</text>
</svg>
